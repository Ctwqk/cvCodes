name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  opencv:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --memory 4g --memory-swap 4g --cpus 4
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      OPENCV_FOR_THREADS_NUM: '2'
      MPLCONFIGDIR: /tmp/pu-cvcodes-matplotlib
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenCV and CPU Python dependencies
        run: |
          bash scripts/install-deps.sh
          echo "/opt/pu-cvcodes-python/bin" >> "$GITHUB_PATH"
      - name: Build all projects, CTest, and independent project builds
        run: bash scripts/verify.sh
      - name: Python model, export, and transfer-learning tests
        run: python3 -m pytest project5/tests -q
      - name: Reproduce gallery and evaluate included data
        run: bash scripts/demo.sh > results.log 2>&1
      - name: Upload results and test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: headless-results
          path: |
            results.log
            results/demo/gallery
            results/demo/mnist/confusion_matrix.txt
            build/Testing/Temporary/LastTest.log
